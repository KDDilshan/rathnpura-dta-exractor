[project]
name = "ikman-ratnapura-extractor"
version = "0.1.0"
description = "Extract ikman.lk classified listings for Sri Lanka's Ratnapura district"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
excel = ["openpyxl>=3.1"]

[project.scripts]
ikman-extract = "ikman.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
